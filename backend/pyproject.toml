[project]
name = "real-estate-intelligence"
version = "0.1.0"
description = "Real Estate Intelligence backend (API, agents, connectors)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.api.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
