# Local development stack. Copy .env.example to .env first.
# Fixed project name: containers, network and volumes are prefixed "real-estate-intelligence"
# and stay isolated from other projects on this machine.
name: real-estate-intelligence

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/database/init/01-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # file watching over Windows bind mounts
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO -Q default

  beat:
    <<: *backend
    command: celery -A app.tasks.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    # No env_file: the frontend must not receive DB/JWT secrets.
    environment:
      WATCHPACK_POLLING: "true"  # file watching over Windows bind mounts
      API_INTERNAL_URL: http://api:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  backup:
    image: postgis/postgis:16-3.4
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./infrastructure/database:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
